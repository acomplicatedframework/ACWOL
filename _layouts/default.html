<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Block Display Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
body {
  background: #000;
  color: #00ff00;
  font-family: "Courier New", monospace;
  margin: 0;
  padding: 60px 40px;
  max-width: 1200px;
  line-height: 1.8;
  animation: fadeIn 1.5s ease-in;
}

/* Scanlines */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,255,0,0.04) 0px,
    rgba(0,255,0,0.04) 1px,
    transparent 2px,
    transparent 4px
  );
  z-index: 9999;
}

/* ACWOL HERO HEADER */
.super-hero {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(6rem, 16vw, 12rem);
  letter-spacing: 1rem;
  text-transform: uppercase;
  text-align: left;
  margin-bottom: 40px;
  color: #00ff00;
  text-shadow:
    0 0 25px #00ff00,
    0 0 60px #00ff00,
    0 0 120px #00ff00,
    0 0 200px #00ff00;
}

/* Thin Cursor */
.cursor {
  display: inline-block;
  width: 0;
  height: 0.9em;
  border-left: 2px solid #00ff00;
  margin-left: 8px;
  animation: blink 1s infinite;
}

/* Boot text */
.boot {
  font-size: 0.9rem;
  opacity: 0.7;
}

hr {
  border: none;
  border-top: 1px solid #00ff00;
  margin: 40px 0;
  opacity: 0.5;
}

/* Section headings */
h2, h3 {
  margin-top: 60px;
}

h2::before {
  content: "> ";
}

/* Links */
a {
  color: #00ff00;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* Remove bullet styling */
ul {
  list-style: none;
  padding-left: 0;
}

li::before {
  content: "> ";
}

/* Animations */
@keyframes blink {
  50% { opacity: 0; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="super-hero">
  ACWOL<span class="cursor"></span>
</div>

<div class="boot">initializing acwol system...</div>
<div class="boot">loading conscience protocols...</div>
<div class="boot">intellect mining protocol loading...</div>

<hr>

{{ content }}

</body>
</html>
