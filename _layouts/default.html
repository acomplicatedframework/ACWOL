<!DOCTYPE html>
<html lang="en">
<head>

  <title>{{ page.title }}</title>

  <style>
    body {
      background-color: black;
      color: #00ff00;
      font-family: "Courier New", monospace;
      margin: 0;
      padding: 60px 40px;
      animation: fadeIn 1.5s ease forwards;
      opacity: 0;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Scanlines */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,0,0.06) 0px,
        rgba(0,255,0,0.06) 1px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
    }

    h1.hero {
      font-size: 90px;
      font-weight: bold;
      text-shadow:
        0 0 10px #00ff00,
        0 0 20px #00ff00,
        0 0 40px #00ff00,
        0 0 80px #00ff00;
      margin-bottom: 30px;
