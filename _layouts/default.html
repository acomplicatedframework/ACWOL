<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #000;
  color: #00ff00;
  font-family: "Courier New", monospace;
  margin: 40px auto;
  padding: 20px;
  max-width: 1000px;
  line-height: 1.8;
  animation: fadeIn 1.5s ease-in;
}

/* Scanlines */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,255,0,0.05) 0px,
    rgba(0,255,0,0.05) 1px,
    transparent 2px,
    transparent 4px
  );
  z-index: 9999;
}

/* Massive ACWOL Header */
.super-hero {
  font-size: clamp(5rem, 14vw, 10rem);
  font-weight: 900;
  letter-spacing: 0.8rem;
  text-transform: uppercase;
  text-align: left;
  margin-bottom: 10px;
  color: #00ff00;
  text-shadow:
    0 0 20px #00ff00,
    0 0 40px #00ff00,
    0 0 80px #00ff00,
    0 0 120px #00ff00;
  animation: glow 2s infinite alternate;
}

/* Thin Cursor */
.cursor {
  display: inline-block;
  width: 0;
  height: 0.9em;
  border-left: 3px solid #00ff00;
  margin-left: 6px;
  animation: blink 1s infinite;
}

/* Boot Text */
.boot {
  font-size: 0.9rem;
  opacity: 0;
  animation: bootText 0.6s forwards;
}

.boot:nth-child(2) { animation-delay: 0.5s; }
.boot:nth-child(3) { animation-delay: 1s; }
.boot:nth-child(4) { animation-delay: 1.5s; }

hr {
  border: none;
  border-top: 1px solid #00ff00;
  margin: 40px 0;
  opacity: 0.6;
}

/* Headings */
h2, h3 {
  color: #00ff00;
  margin-top: 40px;
}

h2::before {
  content: "> ";
}

/* Links */
a {
  color: #00ff00;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* Remove bullet styling */
ul {
  list-style: none;
  padding-left: 0;
}

li::before {
  content: "> ";
}

/* Animations */
@keyframes blink {
  50% { opacity: 0; }
}

@keyframes glow {
  from { text-shadow: 0 0 15px #00ff00; }
  to {
    text-shadow:
      0 0 30px #00ff00,
      0 0 60px #00ff00,
      0 0 100px #00ff00;
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes bootText {
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="super-hero">
  ACWOL<span class="cursor"></span>
</div>

<div class="boot">initializing acwol system...</div>
<div class="boot">loading conscience protocols...</div>
<div class="boot">intellect mining protocol loading...</div>

<hr>

{{ content }}

</body>
</html>
