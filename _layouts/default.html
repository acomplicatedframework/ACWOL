<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Pixel Block Font -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  background: #000;
  color: #00ff00;
  font-family: "Courier New", monospace;
  margin: 0;
  padding: 60px 40px;
  max-width: 1200px;
  line-height: 1.8;
  animation: fadeIn 1.5s ease-in;
}

/* Scanlines */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,255,0,0.04) 0px,
    rgba(0,255,0,0.04) 1px,
    transparent 2px,
    transparent 4px
  );
  z-index: 9999;
}

/* ACWOL Pixel Header */
.super-hero {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(3rem, 10vw, 6rem);
  text-transform: uppercase;
  text-align: left;
  line-height: 1.2;
  margin-bottom: 50px;
  color: #00ff00;

  text-shadow:
    0 0 10px #00ff00,
    0 0 25px #00ff00,
    0 0 50px #00ff00,
    0 0 100px #00ff00;
}

/* Boot text */
.boot {
  font-size: 0.9rem;
  opacity: 0.7;
}

hr {
  border: none;
  border-top: 1px solid #00ff00;
  margin: 40px 0;
  opacity: 0.5;
}

/* Section headings */
h2, h3 {
  margin-top: 60px;
}

h2::before {
  content: "> ";
}

/* Links */
a {
  color: #00ff00;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* Remove bullet styling */
ul {
  list-style: none;
  padding-left: 0;
}

li::before {
  content: "> ";
}

/* Fade In */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="super-hero">
  ACWOL
</div>

<div class="boot">initializing acwol system...</div>
<div class="boot">loading conscience protocols...</div>
<div class="boot">intellect mining protocol loading...</div>

<hr>

{{ content }}

</body>
</html>
