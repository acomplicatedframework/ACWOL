<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Arcade Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", monospace;
      margin: 0;
      padding: 60px 40px;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* CRT Scanlines */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,0,0.05) 0px,
        rgba(0,255,0,0.05) 1px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1000px;
    }

    h1.hero {
      font-size: 95px;
      font-weight: bold;
      text-shadow:
        0 0 10px #00ff00,
        0 0 20px #00ff00,
        0 0 40px #00ff00,
        0 0 80px #00ff00;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 40px;
      margin-top: 70px;
      text-shadow: 0 0 10px #00ff00;
    }

    h3 {
      margin-top: 40px;
      font-size: 24px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      max-width: 900px;
    }

    hr {
      border: none;
      border-top: 1px solid #00ff00;
      margin: 80px 0;
    }

    /* ============================= */
    /* TERMINAL DISCUSSION SECTION   */
    /* ============================= */

    .terminal-heading {
      font-family: 'Press Start 2P', cursive;
      font-size: 28px;
      margin-top: 100px;
      margin-bottom: 50px;
      color: #a020f0;
      text-shadow:
        0 0 8px #a020f0,
        0 0 16px #a020f0,
        0 0 32px #a020f0;
    }

    .terminal-heading::before {
      content: "> ";
    }

    .terminal-discussion {
      border: 1px solid #00ff00;
      padding: 35px;
      background-color: #000000;
      box-shadow: 0 0 20px rgba(0,255,0,0.3);
      margin-bottom: 120px;
    }

  </style>
</head>

<body>
  <div class="content-wrapper">
    {{ content }}

    <hr>

    <h2 class="terminal-heading">SYSTEM_DISCUSSION_LOG</h2>

    <div class="terminal-discussion">
      <div class="giscus"></div>
    </div>

  </div>

  <!-- GISCUS SCRIPT (MUST BE BEFORE </body>) -->
  <script src="https://giscus.app/client.js"
          data-repo="acomplicatedframework/ACWOL"
          data-repo-id="R_kgDORKNoSg"
          data-category="General"
          data-category-id="DIC_kwDORKNoSs4C2i0z"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="custom"
          data-theme-url="https://acomplicatedframework.github.io/ACWOL/assets/giscus-terminal.css?v=9"
          data-lang="en"
          crossorigin="anonymous"
          async>
  </script>

</body>
</html>
