<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", monospace;
      margin: 0;
      padding: 60px 40px;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,0,0.05) 0px,
        rgba(0,255,0,0.05) 1px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      max-width: 900px;
    }

    /* ===== NEW ACWOL BLOCK HEADER ===== */

    .acwol-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 90px;
      letter-spacing: 10px;
      text-transform: uppercase;
      margin-bottom: 80px;
      position: relative;
      display: inline-block;
      color: #00ff00;
    }

    /* Thick block illusion */
    .acwol-header::before {
      content: attr(data-text);
      position: absolute;
      top: 6px;
      left: 6px;
      color: #003300;
      z-index: -1;
    }

    /* Subtle inner segmentation */
    .acwol-header span {
      position: relative;
      display: inline-block;
    }

    .acwol-header span::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid #00aa00;
      box-sizing: border-box;
      opacity: 0.25;
    }

    /* ===== STANDARD TYPOGRAPHY ===== */

    h2 {
      font-size: 40px;
      margin-top: 70px;
    }

    h3 {
      margin-top: 40px;
      font-size: 24px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    hr {
      border: none;
      border-top: 1px solid #00ff00;
      margin: 60px 0;
    }

  </style>
</head>

<body>
  <div class="content-wrapper">

    <!-- ACWOL HEADER -->
    <div class="acwol-header" data-text="ACWOL">
      <span>A</span><span>C</span><span>W</span><span>O</span><span>L</span>
    </div>

    {{ content }}

  </div>
</body>
</html>
