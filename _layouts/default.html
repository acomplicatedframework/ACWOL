<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #000;
      color: #00ff00;
      font-family: "Courier New", monospace;
      line-height: 1.8;
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
      text-transform: lowercase;
    }

    h1, h2, h3 {
      color: #00ff00;
      margin: 30px 0 15px;
    }

    h2::before {
      content: "> ";
    }

    a {
      color: #00ff00;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    ul {
      list-style: none;
      padding-left: 0;
    }

    li::before {
      content: "> ";
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,0,0.05) 0px,
        rgba(0,255,0,0.05) 1px,
        transparent 2px,
        transparent 4px
      );
      z-index: 9999;
    }
  </style>
</head>

<body>
  {{ content }}
</body>
</html>
