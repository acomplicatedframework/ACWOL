<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Arcade Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", monospace;
      margin: 0;
      padding: 60px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* CRT scanlines */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,0,0.05) 0px,
        rgba(0,255,0,0.05) 1px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: auto;
    }

    h1.hero {
      font-size: 80px;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 32px;
      margin-top: 60px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    hr {
      border: none;
      border-top: 1px solid #00ff00;
      margin: 60px 0;
    }

    /* ============================= */
    /* SYSTEM DISCUSSION SECTION */
    /* ============================= */

    .discussion-section {
      margin-top: 120px;
    }

    .discussion-title {
      font-family: 'Press Start 2P', cursive;
      color: #bb00ff;
      font-size: 28px;
      margin-bottom: 50px;
      line-height: 1.6;
    }

    .terminal-box {
      border: 2px solid #00ff00;
      padding: 40px 20px;
    }

    /* Remove forced height issue */
    .giscus {
      width: 100%;
    }

    /* Improve visibility inside cards */
    .giscus .markdown-body {
      background: #000000 !important;
      color: #00ff00 !important;
    }

    /* Improve buttons */
    .giscus button {
      border-radius: 0 !important;
    }

  </style>
</head>

<body>
  <div class="content-wrapper">
    {{ content }}

    <div class="discussion-section">
      <div class="discussion-title">
        &gt; SYSTEM<br>
        DISCUSSION<br>
        LOG
      </div>

      <div class="terminal-box">
        <script src="https://giscus.app/client.js"
        data-repo="acomplicatedframework/ACWOL"
        data-repo-id="R_kgDORKNoSg"
        data-category="General"
        data-category-id="DIC_kwDORKNoSs4C2i0z"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="transparent_dark"
        data-lang="en"
        crossorigin="anonymous"
        async>
</script>
      </div>
    </div>

  </div>
</body>
</html>
