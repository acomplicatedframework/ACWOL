title: ACWOL
description: Core framework for conscience-led decision-making, disciplined Intellect mining, and human–AI co-evolution.

# IMPORTANT: No theme declared
# Do NOT add: theme:
# Do NOT add: remote_theme:

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM

plugins:
  - jekyll-feed

# 🔥 FORCE DEFAULT LAYOUT GLOBALLY
defaults:
  -
    scope:
      path: ""        # applies to all files
      type: "pages"
    values:
      layout: "default"

exclude:
  - README.md
